name: Controle du squelette et des exemples

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verifier les fichiers, liens locaux et JSON
        run: python scripts/check_repo.py
      - name: Verifier les invariants des exemples
        run: python -m unittest discover -s tests/contract -v
      - name: Installer les dependances backend
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Verifier les services backend T03 a T07
        run: python -m unittest discover -s tests/backend -v
      - name: Installer les dependances du simulateur DICOM
        run: python -m pip install -r simulators/modality/requirements.txt
      - name: Verifier la generation et le C-STORE synthetiques
        run: python -m unittest discover -s tests/modality -v
      - name: Verifier les migrations
        working-directory: backend
        env:
          APP_ENV: test
          DATABASE_URL: sqlite+pysqlite:///./t03_ci.db
        run: |
          python -m alembic -c alembic.ini upgrade head
          python -m alembic -c alembic.ini check

