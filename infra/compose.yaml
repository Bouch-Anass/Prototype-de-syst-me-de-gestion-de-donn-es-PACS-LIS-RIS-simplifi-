name: pacs-lis-ris-local

services:
  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: development
      APP_ORIGIN: http://127.0.0.1:8000
    secrets:
      - postgres_password
      - orthanc.secret.json
      - hl7_service_secret
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      orthanc:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - local_services

  postgres:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: pacs_lis_ris
      POSTGRES_USER: app
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d pacs_lis_ris"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks:
      - local_services

  orthanc:
    image: orthancteam/orthanc:26.9.1
    restart: unless-stopped
    environment:
      ORTHANC__NAME: DEMO-PACS
      ORTHANC__DICOM_AET: DEMOPACS
      ORTHANC__DICOM_PORT: "4242"
      ORTHANC__AUTHENTICATION_ENABLED: "true"
      ORTHANC__REMOTE_ACCESS_ALLOWED: "true"
      VERBOSE_STARTUP: "false"
    secrets:
      - orthanc.secret.json
    ports:
      - "127.0.0.1:8042:8042"
      - "127.0.0.1:4242:4242"
    volumes:
      - orthanc_data:/var/lib/orthanc/db
    healthcheck:
      test: ["CMD", "python3", "/probes/test-aliveness.py"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - local_services

secrets:
  hl7_service_secret:
    file: ./.secrets/hl7_service_secret.txt
  postgres_password:
    file: ./.secrets/postgres_password.txt
  orthanc.secret.json:
    file: ./.secrets/orthanc.secret.json

volumes:
  postgres_data:
  orthanc_data:

networks:
  local_services:
    driver: bridge
